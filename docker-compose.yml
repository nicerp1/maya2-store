services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maya
      POSTGRES_PASSWORD: maya_dev_password
      POSTGRES_DB: maya_azma
    ports:
      - "5432:5432"
    volumes:
      - maya_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maya -d maya_azma"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  maya_postgres:
